<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            user-select: none;
        }

        /* Початковий екран помилки */
        #error-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
        }

        .error-icon {
            width: 100px;
            height: 100px;
            border: 4px solid #ffd700;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            color: #ffd700;
            font-weight: bold;
        }

        .error-text {
            font-size: 18px;
            color: #e0e0e0;
        }

        /* Контент, який з'являється після кліку */
        #meme-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .meme-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            background-color: #262626;
            color: #fff;
            border: 1px solid #3d3d3d;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-mute {
            background-color: #3a1c1c;
            color: #ff6b6b;
            border-color: #522727;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="error-screen">
        <div class="error-icon">⚠</div>
        <div class="error-text">Сталася невідома помилка</div>
    </div>

    <div id="meme-screen">
        <img class="meme-img" src="https://i.postimg.co/2S3f6L2x/emoji.png" alt="Meme">
        
        <button class="btn btn-mute" onclick="toggleMute(event)">🔇 Mute</button>
        
        <div class="btn-group">
            <a href="https://t.me" target="_blank" class="btn">Telegram</a>
            <a href="https://tiktok.com" target="_blank" class="btn">TikTok</a>
        </div>
    </div>

    <audio id="bg-audio" loop>
        <source src="ssstik.io_1788374305027 (1).mp3" type="audio/mpeg">
    </audio>

    <script>
        const body = document.body;
        const errorScreen = document.getElementById('error-screen');
        const memeScreen = document.getElementById('meme-screen');
        const audio = document.getElementById('bg-audio');

        // Запуск при тапі/кліку в будь-якому місці
        body.addEventListener('click', () => {
            if (memeScreen.style.display !== 'flex') {
                errorScreen.style.display = 'none';
                memeScreen.style.display = 'flex';
                audio.play();
            }
        });

        function toggleMute(event) {
            event.stopPropagation(); // Щоб не спрацьовував клік по body
            audio.muted = !audio.muted;
        }
    </script>
</body>
</html>
